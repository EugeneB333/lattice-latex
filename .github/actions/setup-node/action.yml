name: Set up Lattice Node.js
description: Install the selected Node.js version and lockfile dependencies after checkout.
inputs:
  node-version:
    description: Node.js major version; defaults to the repository .nvmrc.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .nvmrc
        cache: npm
    - name: Install dependencies
      shell: bash
      env:
        ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      run: npm ci

name: Feature request
description: Suggest an improvement to Lattice.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the expected interaction and any alternatives you have tried.
    validations:
      required: true

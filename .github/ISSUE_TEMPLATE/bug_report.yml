name: Bug report
description: Report a reproducible Lattice problem.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the smallest example source that reproduces the problem. Remove private content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Linux distribution, Lattice commit, Node/Rust versions, browser or desktop, and TeX engine/version where relevant.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove API keys, private paths, and document content before posting.

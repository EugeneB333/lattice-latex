name: Dependency audit
# Full audits can flag existing advisories independently of a code change.
# Keep them visible on a schedule and on demand; Dependabot opens repair PRs.
on:
  schedule:
    - cron: '43 7 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm:
    name: npm vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
      - run: npm audit --audit-level=high
  cargo:
    name: RustSec advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit --file backend/Cargo.lock

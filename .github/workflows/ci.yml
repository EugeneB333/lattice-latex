name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  renderer:
    name: Renderer (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '22'
        with:
          name: browser-demo
          path: dist/
          if-no-files-found: error
          retention-days: 7
  backend:
    name: Rust sidecar
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      # The npm wrappers use /dev/shm for local disposable builds. Use Cargo
      # directly here so the runner's disk cache can persist between runs.
      - run: cargo test --locked --manifest-path backend/Cargo.toml
      # EngineId deliberately uses PdfLatex/XeLatex/LuaLatex names.
      - run: cargo clippy --locked --manifest-path backend/Cargo.toml --all-targets -- -D warnings -A clippy::enum_variant_names
      - run: cargo build --locked --manifest-path backend/Cargo.toml
  automation:
    name: Workflow validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Validate workflow syntax and shell steps
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test AI automation helpers
        run: node --test .github/scripts/ai-tests.cjs

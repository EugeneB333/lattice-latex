[package]
name = "lattice-backend"
version = "0.1.0"
description = "Rust backend for the Lattice LaTeX editor"
authors = ["Lattice contributors"]
edition = "2021"
license = "Apache-2.0"

[dependencies]
base64 = "0.23"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "process", "rt-multi-thread", "time"] }

[profile.dev]
debug = 0
incremental = false

[profile.dev.package."*"]
debug = 0
